spring.application.name=msvc-pedido
server.port=8085
server.servlet.context-path=/api/v1
spring.profiles.active=dev
# Database Configuration - Desarrollo (file-based para persistencia)
# Para producción (AWS), usar variables de entorno o application-prod.properties
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/msvc_pedido_dev}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
