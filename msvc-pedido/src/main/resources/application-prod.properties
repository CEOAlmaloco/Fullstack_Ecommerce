# Configuración de producción para AWS

# Database Configuration - AWS RDS (PostgreSQL recomendado)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:levelup_web_pedido}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
# Fix para PostgreSQL CLOB
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Logging
logging.level.com.ampuero.msvc.pedido=INFO
spring.h2.console.enabled=false

# CORS
cors.allowed-origins=${CORS_ORIGINS:https://yourdomain.com}
cors.service-enabled=${CORS_SERVICE_ENABLED:false}
