spring.application.name=msvc-productos
server.port=8003
server.servlet.context-path=/api/v1
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# Database Configuration - Desarrollo (file-based para persistencia)
# Para producción (AWS), usar variables de entorno o application-prod.properties
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/msvc_productos_dev}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Connection pool (desarrollo)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX:3}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN:1}

# Logging
logging.level.com.ampuero.msvc.producto=INFO
logging.level.com.ampuero.msvc.producto.services.ProductoServiceImpl=DEBUG
logging.level.com.ampuero.msvc.producto.controllers.ProductoController=INFO
# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000
springdoc.api-docs.enable=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
# API Key Configuration
# Genera una API key segura (ej: openssl rand -hex 32)
api.key=${API_KEY:levelup-2024-secret-api-key-change-in-production}
api.key.enabled=${API_KEY_ENABLED:true}

# S3 Configuration
s3.bucket.name=${S3_BUCKET_NAME:levelup-gamer-products}
s3.region=${S3_REGION:us-east-1}
s3.base.url=${S3_BASE_URL:}

# Control de inicializadores
productos.autoconvert-base64=${PRODUCTOS_AUTOCONVERT_BASE64:false}