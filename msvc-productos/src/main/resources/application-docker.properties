# Configuración para entorno Docker local

# Database Configuration - PostgreSQL dentro del stack
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:levelup_productos}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# No inicializar desde data.sql automáticamente
spring.sql.init.mode=never

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# S3 Configuration
s3.bucket.name=${S3_BUCKET_NAME:levelup-gamer-products}
s3.region=${S3_REGION:us-east-1}
s3.base.url=${S3_BASE_URL:https://levelup-gamer-products.s3.us-east-1.amazonaws.com}

seed.productos.enabled=${SEED_PRODUCTOS_ENABLED:true}


