version: "3.9"

# Configuración para usar RDS en lugar de PostgreSQL local
# Comentar el servicio postgres si usas RDS
# Descomentar si quieres usar PostgreSQL local para desarrollo
# 
# postgres:
#   image: postgres:15-alpine
#   container_name: levelup-postgres
#   restart: unless-stopped
#   environment:
#     POSTGRES_USER: postgres
#     POSTGRES_PASSWORD: postgres
#   volumes:
#     - postgres_data:/var/lib/postgresql/data
#     - ./docker/postgres/create-multiple-dbs.sh:/docker-entrypoint-initdb.d/create-multiple-dbs.sh
#   ports:
#     - "5432:5432"
#   healthcheck:
#     test: ["CMD-SHELL", "pg_isready -U postgres"]
#     interval: 10s
#     timeout: 5s
#     retries: 5

services:
  msvc-gateway:
    build:
      context: ./msvc-gateway
      dockerfile: ../DOCKERFILE
    container_name: msvc-gateway
    restart: unless-stopped
    depends_on:
      # postgres:
      #   condition: service_healthy
      msvc-auth:
        condition: service_started
      msvc-usuario:
        condition: service_started
      msvc-productos:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      MSVC_AUTH_URL: http://msvc-auth:8001
      MSVC_USUARIO_URL: http://msvc-usuario:8095
      MSVC_PRODUCTOS_URL: http://msvc-productos:8003
      MSVC_CARRITO_URL: http://msvc-carrito:8008
      MSVC_PEDIDO_URL: http://msvc-pedido:8085
      MSVC_INVENTARIO_URL: http://msvc-inventario:8004
      MSVC_REFERIDOS_URL: http://msvc-referidos:8005
      MSVC_RESENIA_URL: http://msvc-resenia:8010
      MSVC_PAGOS_URL: http://msvc-pagos:8011
      MSVC_NOTIFICACIONES_URL: http://msvc-notificaciones:8006
      MSVC_EVENTOS_URL: http://msvc-eventos:8092
      MSVC_CONTENIDO_URL: http://msvc-contenido:8093
      MSVC_PROMOCIONES_URL: http://msvc-promociones:8091
    ports:
      - "8094:8094"

  frontend:
    build:
      context: ../../Frontend_React_Typescript/levelup-react/proyecto-levelup-frontend/levelup-react
      dockerfile: Dockerfile
    container_name: levelup-frontend
    restart: unless-stopped
    depends_on:
      msvc-gateway:
        condition: service_started
    env_file:
      - ../../Frontend_React_Typescript/levelup-react/proyecto-levelup-frontend/levelup-react/docker.env
    environment:
      VITE_GATEWAY_URL: http://msvc-gateway:8094
    ports:
      - "5173:5173"

  msvc-auth:
    build:
      context: ./msvc-auth
      dockerfile: ../DOCKERFILE
    container_name: msvc-auth
    restart: unless-stopped
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${DB_HOST:-levelup-db.cvcqjuf3hjcs.us-east-1.rds.amazonaws.com}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: levelup_web_auth
      DB_USERNAME: ${DB_USERNAME:-levelup_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-levelUpGamerSecretKey2024SecureForJWT256BitsMinimum}
      MSVC_USUARIO_URL: http://msvc-usuario:8095
    ports:
      - "8001:8001"

  msvc-usuario:
    build:
      context: ./msvc-usuario
      dockerfile: ../DOCKERFILE
    container_name: msvc-usuario
    restart: unless-stopped
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${DB_HOST:-levelup-db.cvcqjuf3hjcs.us-east-1.rds.amazonaws.com}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: levelup_web_usuario
      DB_USERNAME: ${DB_USERNAME:-levelup_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      MSVC_REFERIDOS_URL: http://msvc-referidos:8005
      MSVC_NOTIFICACIONES_URL: http://msvc-notificaciones:8006
      MSVC_PRODUCTOS_URL: http://msvc-productos:8003
      MSVC_INVENTARIO_URL: http://msvc-inventario:8004
      MSVC_AUTH_URL: http://msvc-auth:8001
    ports:
      - "8095:8095"

  msvc-productos:
    build:
      context: ./msvc-productos
      dockerfile: ../DOCKERFILE
    container_name: msvc-productos
    restart: unless-stopped
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${DB_HOST:-levelup-db.cvcqjuf3hjcs.us-east-1.rds.amazonaws.com}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: levelup_web_productos
      DB_USERNAME: ${DB_USERNAME:-levelup_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-levelup-gamer-products}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BASE_URL: ${S3_BASE_URL:-https://levelup-gamer-products.s3.us-east-1.amazonaws.com}
      MSVC_INVENTARIO_API_URL: http://msvc-inventario:8004/api/v1
      MSVC_RESENIA_API_URL: http://msvc-resenia:8010/api/v1
      MSVC_PROMOCIONES_API_URL: http://msvc-promociones:8091/api/v1
    ports:
      - "8003:8003"

  msvc-inventario:
    build:
      context: ./msvc-inventario
      dockerfile: ../DOCKERFILE
    container_name: msvc-inventario
    restart: unless-stopped
    depends_on:
      # postgres:
      #   condition: service_healthy
      msvc-productos:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${DB_HOST:-levelup-db.cvcqjuf3hjcs.us-east-1.rds.amazonaws.com}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: levelup_web_inventario
      DB_USERNAME: ${DB_USERNAME:-levelup_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      PRODUCTOS_URL: http://msvc-productos:8003/api/v1
      MSVC_PRODUCTOS_API_URL: http://msvc-productos:8003/api/v1
    ports:
      - "8004:8004"

  msvc-carrito:
    build:
      context: ./msvc-carrito
      dockerfile: ../DOCKERFILE
    container_name: msvc-carrito
    restart: unless-stopped
    depends_on:
      # postgres:
      #   condition: service_healthy
      msvc-productos:
        condition: service_started
      msvc-inventario:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${DB_HOST:-levelup-db.cvcqjuf3hjcs.us-east-1.rds.amazonaws.com}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: levelup_web_carrito
      DB_USERNAME: ${DB_USERNAME:-levelup_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      MSVC_PRODUCTOS_URL: http://msvc-productos:8003
      MSVC_INVENTARIO_URL: http://msvc-inventario:8004
    ports:
      - "8008:8008"

  msvc-pedido:
    build:
      context: ./msvc-pedido
      dockerfile: ../DOCKERFILE
    container_name: msvc-pedido
    restart: unless-stopped
    depends_on:
      # postgres:
      #   condition: service_healthy
      msvc-carrito:
        condition: service_started
      msvc-inventario:
        condition: service_started
      msvc-pagos:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${DB_HOST:-levelup-db.cvcqjuf3hjcs.us-east-1.rds.amazonaws.com}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: levelup_web_pedido
      DB_USERNAME: ${DB_USERNAME:-levelup_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      MSVC_CARRITO_URL: http://msvc-carrito:8008
      MSVC_INVENTARIO_URL: http://msvc-inventario:8004
      MSVC_PAGOS_URL: http://msvc-pagos:8011
    ports:
      - "8085:8085"

  msvc-pagos:
    build:
      context: ./msvc-pagos
      dockerfile: ../DOCKERFILE
    container_name: msvc-pagos
