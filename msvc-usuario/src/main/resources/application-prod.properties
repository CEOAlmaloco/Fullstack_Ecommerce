# Configuración de producción para AWS

# Database Configuration - AWS RDS (PostgreSQL recomendado)
# Usar variables de entorno en producción para seguridad
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:levelup_usuario}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Logging Configuration
logging.level.com.ampuero.msvc.usuario=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# H2 Console disabled in production
spring.h2.console.enabled=false

# Security
server.ssl.enabled=${SSL_ENABLED:false}

# CORS Configuration - Configurar según dominio de producción
cors.allowed-origins=${CORS_ORIGINS:https://yourdomain.com}

# Monitoring and Health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

