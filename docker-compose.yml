        condition: service_started
      msvc-usuario:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${DB_HOST:-levelup-db.cvcqjuf3hjcs.us-east-1.rds.amazonaws.com}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: levelup_web_resenia
      DB_USERNAME: ${DB_USERNAME:-levelup_admin}
