# Configuración de producción para AWS

# Database Configuration - AWS RDS (PostgreSQL recomendado)
# Usar variables de entorno en producción para seguridad
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:levelup_productos}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# No inicializar desde data.sql en producción (ya debe estar poblada)
spring.sql.init.mode=never

# IMPORTANTE: Deshabilitar seed en producción para evitar que se ejecute seed_productos.sql
# que puede tener rutas antiguas. Usar verificar_y_actualizar_rutas.sql manualmente si es necesario.
seed.productos.enabled=${SEED_PRODUCTOS_ENABLED:false}

# Actualización automática de rutas de imágenes
# Si está habilitado, ejecuta verificar_y_actualizar_rutas.sql automáticamente al iniciar
# Solo ejecuta los comandos UPDATE, ignorando SELECTs
actualizar.rutas.enabled=${ACTUALIZAR_RUTAS_ENABLED:true}

# Connection Pool Configuration (reducido para evitar límite de conexiones RDS)
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Logging Configuration
logging.level.com.ampuero.msvc.producto=INFO
logging.level.com.ampuero.msvc.producto.services.ProductoServiceImpl=INFO
logging.level.org.hibernate.SQL=WARN

# H2 Console disabled in production
spring.h2.console.enabled=false

# CORS Configuration - Configurar según dominio de producción
cors.allowed-origins=${CORS_ORIGINS:https://yourdomain.com}

# Monitoring and Health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

