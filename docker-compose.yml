      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: levelup_web_referidos
      DB_USERNAME: ${DB_USERNAME:-levelup_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      MSVC_USUARIO_URL: http://msvc-usuario:8095
      MSVC_NOTIFICACIONES_URL: http://msvc-notificaciones:8006
      MSVC_PROMOCIONES_URL: http://msvc-promociones:8091
      MSVC_PRODUCTOS_URL: http://msvc-productos:8003
      MSVC_AUTH_URL: http://msvc-auth:8001
