# Configuración de producción para AWS

# Database Configuration - AWS RDS (PostgreSQL recomendado)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:levelup_auth}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT Configuration - Usar variables de entorno en producción
jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Logging
logging.level.com.ampuero.msvc.auth=INFO
spring.h2.console.enabled=false

# CORS
cors.allowed-origins=${CORS_ORIGINS:https://yourdomain.com}
cors.service-enabled=${CORS_SERVICE_ENABLED:false}

