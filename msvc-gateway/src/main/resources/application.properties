spring.application.name=msvc-gateway
server.port=8094
# Web Application Type - Required for Spring Cloud Gateway
spring.main.web-application-type=reactive
# Profiles
spring.profiles.active=dev
# Swagger Documentation for WebFlux
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# API Key Configuration
# Genera una API key segura (ej: openssl rand -hex 32)
api.key=${API_KEY:levelup-2024-secret-api-key-change-in-production}
api.key.enabled=${API_KEY_ENABLED:true}

# Gateway Global Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000,http://localhost:5173,http://10.0.2.2:8094
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Gateway Routes con validación de API Key
spring.cloud.gateway.routes[0].id=auth-route
spring.cloud.gateway.routes[0].uri=http://localhost:8001
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.routes[0].filters[0]=ApiKeyFilter

spring.cloud.gateway.routes[1].id=productos-route
spring.cloud.gateway.routes[1].uri=http://localhost:8003
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/productos/**
spring.cloud.gateway.routes[1].filters[0]=ApiKeyFilter

spring.cloud.gateway.routes[2].id=usuario-route
spring.cloud.gateway.routes[2].uri=http://localhost:8095
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/usuarios/**
spring.cloud.gateway.routes[2].filters[0]=ApiKeyFilter

spring.cloud.gateway.routes[3].id=carrito-route
spring.cloud.gateway.routes[3].uri=http://localhost:8008
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/carrito/**
spring.cloud.gateway.routes[3].filters[0]=ApiKeyFilter
