        condition: service_started
      msvc-usuario:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${DB_HOST:-levelup-db.cvcqjuf3hjcs.us-east-1.rds.amazonaws.com}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: levelup_web_pagos
      DB_USERNAME: ${DB_USERNAME:-levelup_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      MSVC_USUARIO_URL: http://msvc-usuario:8095
      MSVC_PEDIDO_URL: http://msvc-pedido:8085
      MSVC_NOTIFICACIONES_URL: http://msvc-notificaciones:8006
    ports:
      - "8011:8011"

  msvc-resenia:
    build:
      context: ./msvc-resenia
      dockerfile: ../DOCKERFILE
    container_name: msvc-resenia
