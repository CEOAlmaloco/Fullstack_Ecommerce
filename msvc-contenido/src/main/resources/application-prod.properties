# Configuración de producción para AWS

# Database Configuration - AWS RDS (PostgreSQL recomendado)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:levelup_web_contenido}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# IMPORTANTE: En producción usar 'validate' o 'none' para NO modificar el esquema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
# Fix para PostgreSQL CLOB
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# No inicializar desde data.sql en producción (ya debe estar poblada)
spring.sql.init.mode=never

# IMPORTANTE: Deshabilitar inicializador de datos en producción
# El inicializador convierte imágenes a Base64, pero queremos usar URLs de S3
default.data.enabled=${DEFAULT_DATA_ENABLED:false}

# Connection Pool Configuration (reducido para evitar límite de conexiones RDS)
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Logging
logging.level.com.ampuero.msvc.contenido=INFO
spring.h2.console.enabled=false

# CORS
cors.allowed-origins=${CORS_ORIGINS:https://yourdomain.com}

# Monitoring and Health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# S3 Configuration
s3.bucket.name=${S3_BUCKET_NAME:levelup-gamer-products}
s3.region=${S3_REGION:us-east-1}
s3.base.url=${S3_BASE_URL:https://levelup-gamer-products.s3.us-east-1.amazonaws.com}

